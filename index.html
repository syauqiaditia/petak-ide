<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petak</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <style>
      :root, body.variant-a {
        /* Layer 0-3 Depth Tokens (Varian A: Android Studio Slate) */
        --p-bg-base: #1e1f22;
        --p-bg-surface: #26282b;
        --p-bg-workspace: #2b2d30;
        --p-bg-elevated: #35373c;
        --p-bg-hover: #323539;
        --p-bg-active: #383a40;

        --bg-base: var(--p-bg-base);
        --bg-surface: var(--p-bg-surface);
        --bg-workspace: var(--p-bg-workspace);
        --bg-elevated: var(--p-bg-elevated);
        --bg-hover: var(--p-bg-hover);
        --bg-active: var(--p-bg-active);

        /* Border Refinement (Anti Jail-Cell) */
        --border-default: #393b40;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(53, 116, 240, 0.6);

        /* Legacy Aliases & System Colors */
        --bg-titlebar: var(--p-bg-base);
        --bg-panel: var(--p-bg-surface);
        --bg-app: var(--p-bg-base);
        --bg-editor: var(--p-bg-workspace);
        --bg-raised: var(--p-bg-elevated);
        --border: var(--border-default);
        --text: #dbdee1;
        --text-muted: #949ba4;
        --accent: #3574f0;
        --selection-bg: #353b4b;
        --success: #57c87c;
        --warning: #e0aa4e;
        --danger: #e5534b;
      }

      body.variant-b {
        /* Layer 0-3 Depth Tokens (Varian B: Discord Dark) */
        --p-bg-base: #1e1f22;
        --p-bg-surface: #2b2d31;
        --p-bg-workspace: #313338;
        --p-bg-elevated: #383a40;
        --p-bg-hover: #35373c;
        --p-bg-active: #383a40;

        --bg-base: var(--p-bg-base);
        --bg-surface: var(--p-bg-surface);
        --bg-workspace: var(--p-bg-workspace);
        --bg-elevated: var(--p-bg-elevated);
        --bg-hover: var(--p-bg-hover);
        --bg-active: var(--p-bg-active);

        --border-default: #393b40;
        --border-subtle: rgba(255, 255, 255, 0.08);
        --border-focus: rgba(88, 101, 242, 0.6);

        --bg-titlebar: var(--p-bg-base);
        --bg-panel: var(--p-bg-surface);
        --bg-app: var(--p-bg-base);
        --bg-editor: var(--p-bg-workspace);
        --bg-raised: var(--p-bg-elevated);
        --border: var(--border-default);
        --accent: #5865f2;
        --text: #dbdee1;
        --text-muted: #949ba4;
      }

      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--p-bg-base);
        color: var(--text);
        font-family: 'Geist', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        user-select: none;
        -webkit-user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="variant-a">
    <div id="app"></div>
    <script type="module" src="/ui/main.ts"></script>
  </body>
</html>
