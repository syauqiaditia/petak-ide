<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petak</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />
    <style>
      :root {
        --bg-titlebar: #111215;
        --bg-panel: #141518;
        --bg-app: #16171a;
        --bg-editor: #1a1b1f;
        --bg-raised: #23252b;
        --border: #26282d;
        --border-subtle: #2c2e34;
        --text: #d8d9dc;
        --text-muted: #8b8f98;
        --accent: #6ea8ff;
        --selection-bg: #1f2a3d;
        --success: #7fc98f;
        --warning: #e8b45a;
        --danger: #f07a74;
      }
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-app);
        color: var(--text);
        font-family: 'Geist', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        user-select: none;
        -webkit-user-select: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        padding: 0;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/ui/main.ts"></script>
  </body>
</html>
