name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Application via Tauri
        run: npm run tauri -- build

      - name: Prepare Release Artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p release-artifacts
          cp target/release/bundle/dmg/*.dmg release-artifacts/ 2>/dev/null || true
          cd target/release/bundle/macos && zip -r ../../../../release-artifacts/Petak-macos-app.zip Petak.app

      - name: Prepare Release Artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p release-artifacts
          cp target/release/petak-app release-artifacts/petak-linux-x86_64 2>/dev/null || true
          cp target/release/bundle/deb/*.deb release-artifacts/ 2>/dev/null || true
          cp target/release/bundle/appimage/*.AppImage release-artifacts/ 2>/dev/null || true

      - name: Publish Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
