[package]
name = "petak-core"
version = "0.1.0"
edition = "2021"

[dependencies]
ignore = "0.4"
notify = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nucleo-matcher = "0.3.1"
regex = "1.10"
portable-pty = "0.9"
lsp-types = "0.97"
trash = "5"
libc = "0.2"
sha2 = "0.10"
dirs = "5"
tempfile = "3.8"
base64 = "0.22"
ureq = { version = "2.10", default-features = false, features = ["native-tls", "json"] }
chrono = "0.4"

[dev-dependencies]
tiny_http = "0.12"

[[example]]
name = "fake_lsp"

[[example]]
name = "git_log_bench"
